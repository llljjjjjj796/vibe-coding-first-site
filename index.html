<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李冠华 · 心理学译者</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e8e8ea;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; line-height: 1.8;
  }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, #7c6cf0, #4ea8de);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin-bottom: 24px;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .tagline { color: #9a9aa3; font-size: 16px; margin-bottom: 40px; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .card {
    background: #1a1d24; border: 1px solid #2a2d35; border-radius: 16px;
    padding: 24px 20px; width: 210px; text-align: left;
    transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-4px); border-color: #7c6cf0; }
  .card h2 { font-size: 16px; margin-bottom: 8px; }
  .card p { font-size: 13px; color: #9a9aa3; }
  footer { margin-top: 48px; font-size: 13px; color: #55565e; }
  a { color: #7c9ef0; text-decoration: none; }
</style>
</head>
<body>
  <div class="avatar">🌱</div>
  <h1>你好，我是李冠华</h1>
  <p class="tagline">正在学 vibe coding 的心理学自媒体人 · 用 AI 把想法变成产品</p>
  <div class="cards">
    <div class="card"><h2>🧠 心理解读</h2><p>面向年轻人的原生家庭 / 焦虑内耗 / 情绪自救内容</p></div>
    <div class="card"><h2>🛠 自制工具</h2><p>心理测试 H5、情绪日记、树洞留言板 —— 全部自己 vibe 出来</p></div>
    <div class="card"><h2>📚 书单推荐</h2><p>那些真正帮到过我的心理学书籍</p></div>
  </div>
  <footer>这是我的第一个网页 · 用 AI 生成 · <a href="#" id="date"></a></footer>
<script>
  document.getElementById('date').textContent = new Date().getFullYear() + ' 年';
</script>
</body>
</html>
