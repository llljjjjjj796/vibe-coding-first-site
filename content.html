<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理解读 · 落叶心理解剖室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e8e8ea;
    min-height: 100vh; padding: 40px 20px; line-height: 1.8;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .back { color: #7c9ef0; text-decoration: none; font-size: 14px; }
  h1 { font-size: 24px; margin: 20px 0 6px; }
  .sub { color: #9a9aa3; font-size: 14px; margin-bottom: 32px; }
  .video {
    background: #1a1d24; border: 1px solid #2a2d35; border-radius: 16px;
    padding: 22px 20px; margin-bottom: 16px; display: block;
    text-decoration: none; color: inherit; position: relative;
    transition: transform .2s, border-color .2s;
  }
  .video:hover { transform: translateY(-3px); border-color: #7c6cf0; }
  .video .go {
    position: absolute; top: 20px; right: 18px;
    font-size: 12px; color: #55565e; transition: color .2s;
  }
  .video:hover .go { color: #7c6cf0; }
  .video h2 { font-size: 17px; margin-bottom: 8px; }
  .video p { font-size: 14px; color: #9a9aa3; }
  .video .tag {
    display: inline-block; font-size: 12px; color: #7c6cf0;
    border: 1px solid #7c6cf0; border-radius: 20px;
    padding: 1px 10px; margin-bottom: 10px;
  }
  .cta {
    display: block; text-align: center; margin-top: 32px;
    background: linear-gradient(135deg, #7c6cf0, #4ea8de);
    color: #fff; text-decoration: none; font-size: 16px; font-weight: 600;
    border-radius: 14px; padding: 14px;
  }
  .cta:hover { opacity: .9; }
  footer { margin-top: 40px; text-align: center; font-size: 12px; color: #55565e; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回主页</a>
  <h1>🧠 心理解读</h1>
  <p class="sub">把复杂的心理学，翻译成人话。每周更新。</p>

  <!-- ⚠️ 内容维护说明：以后发新视频，只需要改下面这个数组（标题/钩子/标签），其他都不用动 -->
  <div id="video-list"></div>

  <a class="cta" id="douyin-link" href="#" target="_blank" rel="noopener">去抖音看完整版 →</a>
  <footer>落叶心理解剖室 · 用 AI 把想法变成产品</footer>
</div>
<script>
  // ==== 数据区：2026-09-06 由博主本人精选并提供分享链接 ====
  const videos = [
    { title: "情绪稳定，不是没情绪", hook: "你憋着火说「没事」，那不是稳定，是堰塞湖。你上次真实表达情绪，是什么时候？", tag: "情绪管理", link: "https://www.douyin.com/video/7681652459386719514" },
    { title: "朋友圈里没有生活，只有生活的预告片", hook: "你拿自己的幕后花絮，比别人的高光剪辑。今晚，关掉那个界面，做一件只为自己开心的事。", tag: "焦虑", link: "https://www.douyin.com/video/7679117700676767016" },
    { title: "心理学家：喜欢是大脑的反应，爱是每天做出的选择", hook: "心动是有保质期的，心安才是。你现在身边的人，是让你心动的，还是让你心安的？", tag: "亲密关系", link: "https://www.douyin.com/video/7676866178769341737" },
    { title: "你反复解释的样子，就是交出主导权的样子", hook: "你上一次拼命解释，是为了什么？", tag: "讨好型人格", link: "https://www.douyin.com/video/7682424220478999862" },
    { title: "你不是内向，你是怕被评价", hook: "你不是话少，你是把每句话都提前判了死刑。", tag: "社交焦虑", link: "https://www.douyin.com/video/7680939228259192074" },
  ];
  // ==== 你的抖音主页链接（公开主页，已验证可访问）====
  const douyinHome = "https://www.douyin.com/user/MS4wLjABAAAAVKv8S8vHfge3JNfmmGx2yXOHlICvWrsRWB_Ze6WxnEQ";

  const list = document.getElementById('video-list');
  // 每条视频的链接；link 为 "#" 时跳转到抖音主页（等视频链接补齐后逐条替换）
  list.innerHTML = videos.map(v => {
    const url = (v.link && v.link !== "#") ? v.link : douyinHome;
    return `<a class="video" href="${url}" target="_blank" rel="noopener">
      <span class="go">去抖音 ↗</span>
      <span class="tag">${v.tag}</span><h2>${v.title}</h2><p>${v.hook}</p>
    </a>`;
  }).join('');
  if (douyinHome !== "#") document.getElementById('douyin-link').href = douyinHome;
</script>
</body>
</html>
