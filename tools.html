<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自制工具 · 落叶心理解剖室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e8e8ea;
    min-height: 100vh; padding: 40px 20px; line-height: 1.8;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .back { color: #7c9ef0; text-decoration: none; font-size: 14px; }
  h1 { font-size: 24px; margin: 20px 0 6px; }
  .sub { color: #9a9aa3; font-size: 14px; margin-bottom: 32px; }
  .tool {
    background: #1a1d24; border: 1px solid #2a2d35; border-radius: 16px;
    padding: 22px 20px; margin-bottom: 16px; display: flex;
    align-items: center; gap: 16px;
  }
  .tool .icon { font-size: 30px; }
  .tool h2 { font-size: 16px; }
  .tool p { font-size: 13px; color: #9a9aa3; }
  .badge {
    margin-left: auto; flex-shrink: 0; font-size: 12px;
    color: #9a9aa3; border: 1px solid #2a2d35; border-radius: 20px; padding: 3px 12px;
  }
  .badge.new { color: #4ea8de; border-color: #4ea8de; }
  footer { margin-top: 40px; text-align: center; font-size: 12px; color: #55565e; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回主页</a>
  <h1>🛠 自制工具</h1>
  <p class="sub">全部自己 vibe 出来的小工具，做一个上线一个。</p>

  <!-- 第 3 周做完心理测试后，把"敬请期待"改成链接：href="test.html" + class="badge new" + 文案"🆕 新上线" -->
  <div class="tool"><span class="icon">🌱</span><div><h2>内在小孩类型测试</h2><p>5 道题，找到你的内在小孩原型</p></div><span class="badge">敬请期待</span></div>
  <div class="tool"><span class="icon">📔</span><div><h2>情绪打卡日记</h2><p>每天 10 秒，记录此刻的心情</p></div><span class="badge">敬请期待</span></div>
  <div class="tool"><span class="icon">🌳</span><div><h2>树洞留言板</h2><p>匿名倾诉，心事有人听</p></div><span class="badge">敬请期待</span></div>

  <footer>落叶心理解剖室 · 用 AI 把想法变成产品</footer>
</div>
</body>
</html>
